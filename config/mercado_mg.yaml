# intensidade  : peso relativo de consumo de farinha (escala do relatório, 0-5)
# prob_captura : fração do consumo do segmento que um moinho regional
#                realisticamente disputa (concorrência, fidelidade, logística)
# canal        : modelo de atendimento recomendado pelo relatório
# papel        : CONSUMIDOR (consome farinha) | MULTIPLICADOR (revende/capilariza)
# perfis_moinho: perfis do cadastro do Moinho usados para medir o consumo real
segmentos:
  panificacao:
    rotulo: "Panificação e confeitaria"
    cnae_id: 116945
    cnae: "10.91-1"
    papel: CONSUMIDOR
    intensidade: 5
    prob_captura: 0.25
    canal: "RCA / venda direta seletiva"
    perfis_moinho: ["Padaria", "INDUSTRIA DE PANIFICAÇÃO", "Industria de Paes Embalados",
                    "Industria de Paes Congelados"]
  biscoitos:
    rotulo: "Biscoitos e bolachas"
    cnae_id: 116946
    cnae: "10.92-9"
    papel: CONSUMIDOR
    intensidade: 5
    prob_captura: 0.15
    canal: "Key account industrial"
    perfis_moinho: ["Industria de Biscoitos"]
  massas:
    rotulo: "Massas alimentícias"
    cnae_id: 116948
    cnae: "10.94-5"
    papel: CONSUMIDOR
    intensidade: 5
    prob_captura: 0.20
    canal: "Key account industrial"
    perfis_moinho: ["INDUSTRIA DE MASSAS/PASTIFICIO"]
  pratos_prontos:
    rotulo: "Alimentos e pratos prontos (congelados)"
    cnae_id: 116950
    cnae: "10.96-1"
    papel: CONSUMIDOR
    intensidade: 3
    prob_captura: 0.20
    canal: "Indústria potencial — farinha técnica"
    perfis_moinho: ["Industria Alimenticia", "Outras Industrias"]
  food_service:
    rotulo: "Food service (restaurantes, pizzarias, lanchonetes)"
    cnae_id: 117551
    cnae: "56.11-2"
    papel: CONSUMIDOR
    intensidade: 1
    prob_captura: 0.05
    canal: "Via distribuidor"
    perfis_moinho: ["Pizzaria", "Restaurantes", "Lanchonetes", "Bares",
                    "Buffets e Clubes"]
  atacado_farinhas:
    rotulo: "Atacado de cereais, farinhas e amidos"
    cnae_id: 117393
    cnae: "46.32-0"
    papel: MULTIPLICADOR
    intensidade: 4
    prob_captura: 0.30
    canal: "Distribuidor especializado"
    perfis_moinho: ["ATACADISTA DE FARINHA", "ATACADISTA"]
  atacado_alimentos:
    rotulo: "Atacado de produtos alimentícios em geral"
    cnae_id: 117399
    cnae: "46.39-7"
    papel: MULTIPLICADOR
    intensidade: 3
    prob_captura: 0.25
    canal: "Distribuidor / atacarejo"
    perfis_moinho: ["ATACADISTA DE PRODUTOS AGRÍCOLAS", "CESTA BÁSICA", "COOPERATIVAS"]
  varejo_padaria:
