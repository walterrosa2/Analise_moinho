    canal: "Cauda longa via distribuidor"
    perfis_moinho: ["Minimercado (<5 CheckOuts)", "Supermercado (entre 5 e 49 Checkouts)",
                    "Hipermercado (>50 CheckOuts)", "OUTROS TIPOS DE VAREJO",
                    "Outros Tipos de Varejo"]

# ---------------------------------------------------------------------
# Modelo de potencial
# ---------------------------------------------------------------------
modelo:
  # Como o consumo por estabelecimento é obtido:
  #   OBSERVADO = mediana de t/mês dos clientes reais do Moinho no segmento
  #               (método recomendado pelo relatório — usa a economia real)
  #   FALLBACK  = usado quando o segmento tem menos que minimo_clientes_amostra
  #               clientes observados; deriva da intensidade relativa.
  origem_consumo: OBSERVADO
  minimo_clientes_amostra: 5

  # Consumo de referência (t/mês) para intensidade = 1, usado só no fallback.
  consumo_fallback_por_intensidade_t_mes: 0.35

  # Ajuste de porte: o CEMPRE publica pessoal ocupado por município e CNAE.
  # Municípios com estabelecimentos maiores que a média estadual do segmento
  # recebem fator > 1. Limitado para não deixar outlier dominar o mapa.
  ajuste_porte:
    ativo: true
    fator_minimo: 0.5
    fator_maximo: 2.5

  # Janela de vendas considerada "presença atual" do Moinho.
  janela_vendas_meses: 12

# ---------------------------------------------------------------------
# Classificação de White Space (matriz potencial x venda)
# ---------------------------------------------------------------------
# Corte por percentil dentro do próprio estado — evita depender de valores
# absolutos que mudam quando a série cresce.
#
# As cores das três classes de ação foram validadas para daltonismo
# (separação CVD em OKLab acima do piso, croma e contraste aprovados nos temas
# claro e escuro). "Baixa prioridade" usa um neutro de propósito: não é uma
# categoria de ação, é o fundo contra o qual as outras três se destacam.
white_space:
  percentil_potencial_alto: 0.70
  percentil_venda_alta: 0.70
  penetracao_saudavel_pct: 5.0
  classes:
    ALTO_ALTA:
      rotulo: "Fortaleza"
      cor: "#0D8A78"
      acao: "Defender e aprofundar mix"
    ALTO_BAIXA:
      rotulo: "White Space"
      cor: "#D2481B"
      acao: "Atacar — maior prioridade"
    BAIXO_ALTA:
      rotulo: "Bem penetrado"
      cor: "#2563EB"
      acao: "Avaliar concentração e risco"
    BAIXO_BAIXA:
      rotulo: "Baixa prioridade"
      cor: "#9AA8A4"
      acao: "Atender via distribuidor"

# ---------------------------------------------------------------------
# Viabilidade logística
# ---------------------------------------------------------------------
# Atratividade = Potencial Comercial x Viabilidade Logística (relatório).
# O frete real R$/t por cidade vem do CT-e; onde não há histórico, usa-se
# a mediana da região intermediária.
logistica:
  ativo: true
  multiplo_frete_inviavel: 2.5
  peso_na_atratividade: 0.35

# ---------------------------------------------------------------------
# Território dos RCAs
# ---------------------------------------------------------------------
territorio:
  fonte_regiao_comercial: regiao_comercial          # CIDADE | REGIÃO COMERCIAL | REPRESENTANTE
  fonte_regiao_representante: regiao_representante   # CIDADE | ESTADO | CÓDIGO-REPRESENTANTE | REPRESENTANTE
  sufixos_ruido: [", Minas Gerais", " - MG", ", MG", " (MG)", " MG"]
