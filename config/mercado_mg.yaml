# =====================================================================
# Potencial de mercado de FARINHA em Minas Gerais — parâmetros de negócio
# =====================================================================
# Por que este arquivo existe:
#   A análise de potencial é uma OPINIÃO ESTRUTURADA, não um fato medido.
#   Todo julgamento (quais CNAEs contam, quanto cada segmento consome,
#   que fração é capturável) fica aqui, versionado e auditável — nunca
#   embutido no código. Trocar um número aqui recalcula o mapa inteiro.
#
# Base do desenho: "deep-research-report-potencial-vendas.md" (2026-09-05),
#   que recomenda medir POTENCIAL ECONÔMICO por município — e não simples
#   contagem de estabelecimentos — e calibrar o consumo pela economia real
#   dos próprios clientes do Moinho.
#
# STATUS: PROVISIONAL — pesos e probabilidades aguardam homologação
#         comercial (Q-16).
# =====================================================================

versao: "1.0"
status: PROVISIONAL
homologado_em: null
homologado_por: null

uf_alvo: MG
codigo_uf_ibge: 31

# Classificações de produto que compõem o mercado estudado.
# FARELO fica de fora: é cadeia de ração animal, não de panificação.
classificacoes_no_escopo:
  - FARINHAS
  - MISTURAS
  - BOLO

# ---------------------------------------------------------------------
# Fontes públicas (IBGE). Nenhuma URL fica no código.
# ---------------------------------------------------------------------
fontes_ibge:
  municipios: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/{uf}/municipios"
  populacao:
    agregado: 4714          # Censo 2022 — População residente
    variavel: 93
    periodo: "2022"
  empresas:
    agregado: 9528          # CEMPRE — Unidades locais por município e classe CNAE 2.0
    variavel_unidades: 706  # Número de unidades locais
    variavel_pessoal: 707   # Pessoal ocupado total (proxy de porte)
    periodo: "-1"           # -1 = período mais recente publicado
    classificacao: 12762    # CNAE 2.0
  malha:
    url: "https://servicodados.ibge.gov.br/api/v3/malhas/estados/{uf}"
    qualidade: "intermediaria"   # minima | intermediaria | maxima

# ---------------------------------------------------------------------
# Segmentos de mercado consumidores de farinha
# ---------------------------------------------------------------------
