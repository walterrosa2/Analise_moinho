[theme]
base = "dark"
primaryColor = "#00A8B5"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"

[server]
address = "0.0.0.0"
port = 8501
headless = true
maxUploadSize = 200
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
