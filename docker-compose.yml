services:
  postgres:
    image: postgres:16-alpine
    container_name: moinho_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moinho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moinho}
      POSTGRES_DB: ${POSTGRES_DB:-moinho_analytics}
      # Locale pt_BR para ordenação correta de acentos
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 5432/5433 costumam estar ocupadas por outros projetos locais
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - moinho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moinho} -d ${POSTGRES_DB:-moinho_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_parallel_workers_per_gather=4"

  app:
    build: .
    container_name: moinho_analytics_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moinho}:${POSTGRES_PASSWORD:-moinho}@postgres:5432/${POSTGRES_DB:-moinho_analytics}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      # Planilhas ficam FORA do repositório e da imagem
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    profiles:
      - full

volumes:
  moinho_pgdata:
    name: moinho_analytics_pgdata
